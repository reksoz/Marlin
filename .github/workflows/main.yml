name: Build Marlin for Geeetech A10 with BLTouch & Dual Drive

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Cache PlatformIO
      uses: actions/cache@v3
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: Build firmware
      run: |
        platformio run -e mega2560
    
    - name: List build directory
      run: |
        ls -la .pio/build/mega2560/
    
    - name: Create MARLIN directory if it doesn't exist
      run: mkdir -p MARLIN
    
    - name: Copy firmware to MARLIN directory
      run: cp .pio/build/mega2560/firmware.hex MARLIN/
    
    - name: Commit and push firmware
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add MARLIN/firmware.hex
        git commit -m "Update compiled firmware" || echo "No changes to commit"
        git push
